<div class="youtube-page">

    <div style="margin-bottom:15px;">
    <button
        id="youtubeBackBtn"
        type="button"
        onclick="history.back()"
        style="padding:10px 16px;">
        ← رجوع
    </button>
</div>



    <div class="youtube-hero">
        <div class="youtube-icon">▶️</div>



        <h1>Auto YouTube</h1>

        <p>
            اربط قناتك على YouTube مع UltraAI
            واستعد للنشر التلقائي للمحتوى.
        </p>
    </div>

    <section class="youtube-card">

        <div id="youtubeStatus">

            <div class="youtube-status-icon">
                🔴
            </div>

            <h2>قناة YouTube غير مربوطة</h2>

            <p>
                اربط قناتك للبدء باستخدام ميزات YouTube.
            </p>

        </div>

        <button
            id="youtubeConnectPageBtn"
            type="button"
            >

            ▶️ ربط قناة YouTube

        </button>

    </section>

    <section
        id="youtubeAutoSection"
        class="youtube-card"
        style="display:none;">

        <h2>🤖 النشر التلقائي على YouTube</h2>

        <div id="youtubeAutoConnection">
            🟢 YouTube: Connected
        </div>

        <label>🌅 وقت الصباح</label>

        <input
            id="youtubeAutoMorningTime"
            type="time"
            value="09:00">

        <label>🌙 وقت المساء</label>

        <input
            id="youtubeAutoEveningTime"
            type="time"
            value="20:00">

        <label>🔐 Privacy</label>

        <select id="youtubeAutoPrivacy">
            <option value="private">Private — خاص</option>
            <option value="unlisted">Unlisted — غير مدرج</option>
            <option value="public">Public — عام</option>
        </select>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;">

            <button
                id="youtubeAutoSaveBtn"
                type="button">
                💾 حفظ الإعدادات
            </button>

            <button
                id="youtubeAutoStartBtn"
                type="button">
                ▶️ تشغيل النشر التلقائي
            </button>

            <button
                id="youtubeAutoStopBtn"
                type="button"
                style="display:none;">
                ⏸️ إيقاف النشر التلقائي
            </button>

        </div>

        <div
            id="youtubeAutoStatus"
            style="margin-top:15px;">
        </div>

    </section>

    <section
        id="youtubeUploadSection"
        class="youtube-card"
        style="display:none;">

        <h2>📤 نشر فيديو على YouTube</h2>

        <label>🎬 الفيديو</label>

        <input
            id="youtubeVideoFile"
            type="file"
            accept="video/*">

        <label>📝 العنوان</label>

        <input
            id="youtubeVideoTitle"
            type="text"
            maxlength="100"
            placeholder="عنوان الفيديو">

        <label>📄 الوصف</label>

        <textarea
            id="youtubeVideoDescription"
            maxlength="5000"
            placeholder="وصف الفيديو"></textarea>

        <label>🔐 الخصوصية</label>

        <select id="youtubePrivacyStatus">
            <option value="private">خاص</option>
            <option value="unlisted">غير مدرج</option>
            <option value="public">عام</option>
        </select>

        <button
            id="youtubeUploadBtn"
            type="button"
            >
            📤 نشر على YouTube
        </button>

        <div
            id="youtubeUploadResult"
            style="margin-top:15px;">
        </div>

    </section>

</div>
