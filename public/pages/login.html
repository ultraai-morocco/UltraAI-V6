<div class="auth-page">

    <div class="auth-card">

        <h2>🔐 تسجيل الدخول</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="البريد الإلكتروني">

        <input
            type="password"
            id="loginPassword"
            placeholder="كلمة المرور">

        <button class="primary" onclick="login()">
            تسجيل الدخول
        </button>

        <p>
            <a href="#"
               onclick="loadPage('forgot-password'); return false;">
                🔑 نسيت كلمة السر؟
            </a>
        </p>

        <p>
            ليس لديك حساب؟
            <a href="#" onclick="loadPage('register'); return false;">
                إنشاء حساب
            </a>
        </p>

    </div>

</div>
