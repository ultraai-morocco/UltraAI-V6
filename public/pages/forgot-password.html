<div class="auth-page">

    <div class="auth-card">

        <h2>🔐 نسيت كلمة السر؟</h2>

        <div id="forgotStep1">

            <p>
                دخل البريد الإلكتروني ديال الحساب
                باش نرسلولك رمز التحقق.
            </p>

            <input
                type="email"
                id="resetEmail"
                placeholder="البريد الإلكتروني"
                autocomplete="email">

            <button
                type="button"
                class="primary"
                onclick="sendResetOTP()">
                📩 إرسال رمز التحقق
            </button>

        </div>

        <div id="forgotStep2" style="display:none">

            <input
                type="text"
                id="resetOTP"
                placeholder="رمز التحقق"
                inputmode="numeric"
                autocomplete="one-time-code">

            <input
                type="password"
                id="resetNewPassword"
                placeholder="كلمة السر الجديدة"
                autocomplete="new-password">

            <input
                type="password"
                id="resetConfirmPassword"
                placeholder="تأكيد كلمة السر الجديدة"
                autocomplete="new-password">

            <button
                type="button"
                class="primary"
                onclick="resetPassword()">
                🔑 تغيير كلمة السر
            </button>

        </div>

        <p>
            <a
                href="#"
                onclick="loadPage('login'); return false;">
                ← الرجوع لتسجيل الدخول
            </a>
        </p>

    </div>

</div>
